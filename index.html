<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#a55461" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PdParizz" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <title>PdParizz MVP Preview</title>
    <style>
:root {
  --ink: #171512;
  --muted: #746f68;
  --paper: #f7f4ed;
  --surface: #fffdf8;
  --line: #e8e1d6;
  --rose: #a55461;
  --rose-soft: #f3e3e5;
  --gold: #9a742d;
  --success: #2f7255;
  --danger: #a43e3e;
  --radius-sm: 12px;
  --radius-md: 18px;
  --radius-lg: 28px;
  --shadow: 0 22px 70px rgba(31, 24, 18, 0.18);
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--ink);
  background: #e8e2d9;
}

* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; }
button, input, textarea { font: inherit; }
button { color: inherit; cursor: pointer; }
button:disabled { cursor: default; opacity: .55; }
a, [data-screen], [data-action], .product-card, .menu-row, .order-card { cursor: pointer; }
button:active, [data-screen]:active, .product-card:active { transform: scale(.985); }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 3px solid rgba(165,84,97,.35); outline-offset: 2px; }

.audit-panel {
  position: fixed;
  inset: 0 auto 0 0;
  width: 280px;
  padding: 28px 22px;
  background: #1d1a17;
  color: #fff;
  overflow: auto;
}
.audit-panel strong { display: block; font-size: 17px; letter-spacing: .02em; }
.audit-panel small { display: block; color: #aaa39a; margin-top: 7px; }
.audit-panel nav { display: grid; gap: 8px; margin-top: 28px; }
.audit-panel a {
  color: #d8d2ca;
  text-decoration: none;
  padding: 10px 12px;
  border-radius: 10px;
  font-size: 14px;
}
.audit-panel a:hover, .audit-panel a.active { color: #fff; background: #37312c; }

.stage {
  min-height: 100vh;
  margin-left: 280px;
  padding: 36px;
  display: grid;
  place-items: center;
}
.phone {
  width: 390px;
  height: 844px;
  border: 10px solid #171513;
  border-radius: 48px;
  background: var(--paper);
  box-shadow: var(--shadow);
  overflow: hidden;
  position: relative;
}
.status-bar {
  height: 34px;
  padding: 10px 22px 4px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--paper);
  font-size: 11px;
  font-weight: 700;
}
.app-surface { height: calc(100% - 34px); overflow: auto; scrollbar-width: none; }
.app-surface::-webkit-scrollbar { display: none; }

.screen { min-height: 100%; padding: 18px 18px 94px; background: var(--paper); }
.screen.with-action { padding-bottom: 116px; }
.topline { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 22px; }
.eyebrow { margin: 0 0 6px; color: var(--rose); font-size: 11px; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; }
h1, h2, h3, p { margin-top: 0; }
h1 { margin-bottom: 0; font: 500 31px/1.05 Georgia, serif; letter-spacing: -.025em; }
h2 { margin-bottom: 12px; font: 500 23px/1.15 Georgia, serif; }
h3 { margin-bottom: 5px; font-size: 15px; }
.subtle { color: var(--muted); font-size: 13px; line-height: 1.45; }
.icon-btn, .back-btn {
  width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface);
  display: grid; place-items: center; flex: 0 0 auto;
}
.back-btn { font-size: 19px; }

.search {
  height: 48px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line);
  display: flex; align-items: center; gap: 10px; padding: 0 14px; color: var(--muted); font-size: 14px;
}
.search input { width: 100%; border: 0; outline: 0; background: transparent; color: var(--ink); font-size: 14px; }
.search input::placeholder { color: var(--muted); }
.chips { display: flex; gap: 8px; margin: 14px 0 20px; overflow: hidden; }
.chip { white-space: nowrap; border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 8px 12px; font-size: 12px; }
.chip.active { border-color: var(--ink); background: var(--ink); color: #fff; }

.hero {
  min-height: 176px; border-radius: var(--radius-lg); padding: 22px; color: #fff; margin-bottom: 24px;
  background: radial-gradient(circle at 85% 20%, rgba(255,255,255,.45), transparent 23%), linear-gradient(140deg, #6d333e, #be7d86);
  position: relative; overflow: hidden;
}
.hero::after { content: "P"; position: absolute; right: 18px; bottom: -40px; font: 150px Georgia, serif; color: rgba(255,255,255,.12); }
.hero h2 { width: 68%; font-size: 28px; margin-top: 30px; }
.hero p { font-size: 12px; color: rgba(255,255,255,.8); }

.section-head { display: flex; align-items: baseline; justify-content: space-between; margin: 22px 0 12px; }
.section-head h2 { margin: 0; }
.section-head span { color: var(--rose); font-size: 12px; }
.product-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.product-card { min-width: 0; }
.product-art {
  aspect-ratio: 1 / 1.18; border-radius: var(--radius-md); position: relative; overflow: hidden;
  background: radial-gradient(circle at 70% 18%, #fff 0 4%, transparent 32%), linear-gradient(150deg, #e6d7c3, #b49b7c);
}
.product-card:nth-child(even) .product-art { background: radial-gradient(circle at 72% 17%, #fff 0 3%, transparent 30%), linear-gradient(150deg, #e4d5da, #9f707d); }
.product-image { width: 100%; height: 100%; object-fit: contain; padding: 12px; background: #f4f0e8; display: block; }
.bottle {
  position: absolute; width: 62px; height: 89px; left: 50%; top: 51%; transform: translate(-50%, -50%);
  background: rgba(255,255,255,.72); border: 1px solid rgba(70,55,42,.25); border-radius: 5px 5px 12px 12px; box-shadow: 0 12px 18px rgba(53,35,22,.16);
}
.bottle::before { content: ""; position: absolute; width: 28px; height: 15px; top: -15px; left: 16px; background: #2d2925; border-radius: 3px 3px 0 0; }
.bottle::after { content: "PdP"; position: absolute; left: 12px; right: 12px; top: 36px; border-top: 1px solid #a99a88; border-bottom: 1px solid #a99a88; padding: 5px 0; text-align: center; font: 10px Georgia, serif; }
.heart { position: absolute; top: 10px; right: 10px; width: 32px; height: 32px; border: 0; border-radius: 50%; background: rgba(255,255,255,.78); }
.product-meta { padding: 10px 2px 0; }
.product-meta h3 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.product-meta p { margin: 0; color: var(--muted); font-size: 11px; }
.price { margin-top: 7px; font-weight: 750; font-size: 14px; }

.bottom-nav {
  position: absolute; inset: auto 0 0; height: 78px; padding: 10px 16px 18px; background: rgba(255,253,248,.96); border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(4, 1fr); z-index: 5;
}
.nav-item { display: grid; place-items: center; align-content: center; gap: 4px; color: var(--muted); font-size: 10px; }
.nav-item b { font-size: 18px; line-height: 1; font-weight: 500; }
.nav-item.active { color: var(--rose); }

.product-hero { height: 330px; margin: -18px -18px 22px; position: relative; background: linear-gradient(145deg, #eadfd0, #bca184); }
.product-hero-image { width: 100%; height: 100%; object-fit: contain; padding: 24px 38px; background: #f1ece3; display: block; }
.product-hero .bottle { width: 112px; height: 165px; border-radius: 9px 9px 20px 20px; }
.product-hero .bottle::before { width: 48px; height: 23px; top: -23px; left: 31px; }
.product-hero .bottle::after { left: 20px; right: 20px; top: 68px; font-size: 16px; padding: 10px 0; }
.product-hero .back-btn, .product-hero .heart { position: absolute; top: 18px; z-index: 2; }
.product-hero .back-btn { left: 18px; }
.product-hero .heart { right: 18px; width: 42px; height: 42px; }
.rating { color: var(--gold); font-size: 12px; }
.notes { display: flex; gap: 8px; margin: 18px 0; }
.note { flex: 1; padding: 12px 8px; text-align: center; border: 1px solid var(--line); border-radius: var(--radius-sm); }
.note b { display: block; font: 17px Georgia, serif; margin-bottom: 4px; }
.note span { color: var(--muted); font-size: 10px; }

.fixed-action {
  position: absolute; inset: auto 0 0; padding: 12px 18px 18px; background: linear-gradient(transparent, var(--paper) 22%); z-index: 6;
}
.primary { width: 100%; min-height: 52px; border: 0; border-radius: 16px; background: var(--ink); color: #fff; font-weight: 750; }
.primary.rose { background: var(--rose); }
.row { display: flex; align-items: center; gap: 12px; }
.between { justify-content: space-between; }

.card { padding: 16px; border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--surface); }
.cart-line { display: grid; grid-template-columns: 74px 1fr auto; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.cart-line:last-child { border-bottom: 0; }
.thumb { width: 74px; height: 88px; border-radius: 13px; background: linear-gradient(145deg, #e5d6c3, #b79e7e); position: relative; }
.thumb img { width: 100%; height: 100%; object-fit: contain; padding: 6px; border-radius: inherit; background: #f4f0e8; }
.thumb .bottle { transform: translate(-50%,-50%) scale(.55); }
.quantity { display: flex; align-items: center; gap: 11px; margin-top: 15px; }
.quantity button { width: 28px; height: 28px; border: 1px solid var(--line); border-radius: 9px; background: #fff; }
.summary { display: grid; gap: 12px; margin-top: 18px; }
.summary .row { justify-content: space-between; font-size: 13px; }
.summary .total { border-top: 1px solid var(--line); padding-top: 13px; font-weight: 800; font-size: 16px; }
.loyalty-toggle { border-color: #e2c68d; background: #fffaf0; }
.coin { width: 38px; height: 38px; border-radius: 50%; background: #c99735; color: #fff; display: grid; place-items: center; font-weight: 800; }
.switch { width: 43px; height: 25px; border-radius: 20px; background: var(--rose); padding: 3px; }
.switch::after { content: ""; display: block; margin-left: auto; width: 19px; height: 19px; border-radius: 50%; background: #fff; }
.switch.off { background: #c7c0b6; }
.switch.off::after { margin-left: 0; }
.tariff.selected { border-color: var(--rose); box-shadow: 0 0 0 2px var(--rose-soft); }

.field { padding: 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); margin-bottom: 10px; }
.field label { display: block; color: var(--muted); font-size: 10px; margin-bottom: 5px; }
.field strong { font-size: 13px; }
.field input, .field textarea { width: 100%; border: 0; outline: 0; resize:none; background: transparent; color: var(--ink); font-size: 14px; }
.otp-grid { display: grid; grid-template-columns: repeat(4, 58px); justify-content: center; gap: 10px; }
.otp-input { width: 58px; height: 64px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); text-align: center; font-size: 24px; font-weight: 750; color: var(--ink); }
.install-logo { width: 92px; height: 92px; border-radius: 24px; background: var(--rose); color: #fff; display: grid; place-items: center; font: 52px Georgia, serif; box-shadow: 0 14px 30px rgba(165,84,97,.24); }
.install-step { display: grid; grid-template-columns: 34px 1fr; gap: 12px; align-items: start; padding: 13px 0; border-bottom: 1px solid var(--line); }
.install-step:last-child { border-bottom: 0; }
.step-number { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--rose-soft); color: var(--rose); font-weight: 800; font-size: 12px; }
.event-row { padding: 11px 0; border-bottom: 1px solid var(--line); }
.event-row:last-child { border-bottom: 0; }
.event-row time { color: var(--muted); font-size: 10px; }
.onboarding-art { height: 330px; margin: -18px -18px 28px; border-radius: 0 0 36px 36px; display: grid; place-items: center; background: radial-gradient(circle at 50% 42%, rgba(255,255,255,.7), transparent 25%), linear-gradient(145deg,#ead9dc,#b86f7b); color:#fff; font: 150px Georgia,serif; position:relative; overflow:hidden; }
.onboarding-art::after { content:"PdParizz"; position:absolute; bottom:28px; font: 18px Georgia,serif; letter-spacing:.08em; }
.progress-dots { display:flex; gap:7px; margin:18px 0; }
.progress-dot { width:7px; height:7px; border-radius:50%; background:#d0c9bf; }
.progress-dot.active { width:24px; border-radius:99px; background:var(--rose); }
.quiz-progress { height:5px; border-radius:99px; background:#e6dfd5; overflow:hidden; margin-bottom:28px; }
.quiz-progress span { display:block; height:100%; background:var(--rose); transition:width .25s ease; }
.quiz-choice { width:100%; text-align:left; margin-bottom:10px; display:flex; align-items:center; justify-content:space-between; }
.promo-strip { width:100%; border:0; text-align:left; margin:0 0 20px; background:#24201d; color:#fff; }
.volume-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:9px; margin:10px 0 18px; }
.volume-option { min-height:58px; border:1px solid var(--line); border-radius:14px; background:var(--surface); display:grid; place-items:center; gap:2px; padding:8px; }
.volume-option.selected { border-color:var(--rose); box-shadow:0 0 0 2px var(--rose-soft); }
.volume-option small { color:var(--muted); font-size:10px; }
.stock-line { color:var(--success); font-size:12px; font-weight:750; margin:12px 0; }
.buy-actions { display:grid; grid-template-columns:1fr 1.25fr; gap:9px; }
.review-stars { color:var(--gold); letter-spacing:.08em; }
.review-bar { display:grid; grid-template-columns:18px 1fr 30px; gap:8px; align-items:center; margin:7px 0; font-size:11px; }
.review-track { height:6px; border-radius:99px; background:#eee7dd; overflow:hidden; }
.review-track span { display:block; height:100%; background:var(--gold); }
.date-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.date-option { min-height:60px; border:1px solid var(--line); border-radius:14px; background:var(--surface); padding:8px 5px; font-size:11px; }
.date-option.selected { border-color:var(--rose); background:var(--rose-soft); }
.slot-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:9px; }
.map-placeholder { height:230px; border-radius:22px; margin-bottom:16px; position:relative; overflow:hidden; background:linear-gradient(28deg,transparent 48%,rgba(255,255,255,.9) 49% 54%,transparent 55%),linear-gradient(148deg,#dfe6db,#e9ded1); }
.map-placeholder::before,.map-placeholder::after { content:""; position:absolute; border-radius:50%; background:var(--rose); border:5px solid #fff; width:18px;height:18px; box-shadow:0 4px 12px rgba(0,0,0,.2); }
.map-placeholder::before { left:95px;top:72px; }
.map-placeholder::after { right:74px;bottom:54px; }
.map-label { position:absolute; left:16px; top:16px; padding:8px 10px; border-radius:10px; background:rgba(255,255,255,.92); font-size:11px; font-weight:750; }
.map-pin { position:absolute; width:30px; height:30px; margin:-15px 0 0 -15px; border:4px solid #fff; border-radius:50% 50% 50% 8px; transform:rotate(-45deg); display:grid; place-items:center; background:var(--rose); color:#fff; box-shadow:0 5px 14px rgba(0,0,0,.22); font-size:11px; font-weight:800; z-index:2; }
.map-pin::first-letter { transform:rotate(45deg); }
.offer-card { width:100%; text-align:left; margin-bottom:12px; position:relative; overflow:hidden; }
.offer-card::after { content:"P"; position:absolute; right:-8px; top:-28px; font:110px Georgia,serif; color:rgba(165,84,97,.07); pointer-events:none; }
.offer-badge { display:inline-flex; padding:5px 8px; border-radius:999px; background:var(--rose-soft); color:var(--rose); font-size:10px; font-weight:800; margin-bottom:10px; }
.offer-card.dark { background:#24201d; color:#fff; border:0; }
.offer-card.dark::after { color:rgba(255,255,255,.06); }
.offer-card.dark .subtle { color:#cfc7bf; }
.offer-action { margin-top:14px; min-height:40px; width:auto; padding:0 16px; border:0; border-radius:12px; background:var(--rose); color:#fff; font-size:12px; font-weight:750; position:relative; z-index:1; }
.promo-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; }
.promo-row button { border: 0; border-radius: 10px; padding: 9px 11px; background: var(--ink); color: #fff; font-size: 11px; font-weight: 750; }
.choice-card { width: 100%; text-align: left; margin-bottom: 10px; }
.choice-card.selected { border-color: var(--rose); box-shadow: 0 0 0 2px var(--rose-soft); }
.payment-card { display: flex; gap: 12px; align-items: center; }
.radio { width: 20px; height: 20px; border: 6px solid var(--rose); border-radius: 50%; }

.order-card { margin-bottom: 12px; }
.order-card .order-number { font-weight: 800; font-size: 14px; }
.status { display: inline-flex; padding: 6px 9px; border-radius: 999px; background: #e7f3ec; color: var(--success); font-size: 10px; font-weight: 800; }
.status.cancelled { background: #f1e9e7; color: #8b4a43; }
.timeline { margin: 22px 0 0 8px; }
.timeline-item { position: relative; padding: 0 0 24px 28px; border-left: 1px solid #d6cec3; }
.timeline-item::before { content: ""; position: absolute; left: -6px; width: 11px; height: 11px; border-radius: 50%; background: var(--surface); border: 2px solid #bcb3a8; }
.timeline-item.done::before { border-color: var(--success); background: var(--success); }
.timeline-item:last-child { border-left-color: transparent; }
.timeline-item h3 { margin-bottom: 3px; font-size: 13px; }
.notification-card { width: 100%; text-align: left; margin-bottom: 12px; }
.notification-card.unread { border-color: #c99aa1; background: #fff8f8; }
.notification-card .notification-copy { flex: 1; min-width: 0; }
.notification-dot { width: 8px; height: 8px; flex: none; border-radius: 50%; background: var(--rose); }
.chat-thread { display: grid; gap: 10px; margin: 18px 0; }
.chat-bubble { max-width: 84%; padding: 11px 13px; border-radius: 16px 16px 16px 4px; background: var(--surface); border: 1px solid var(--line); font-size: 13px; line-height: 1.4; }
.chat-bubble.mine { margin-left: auto; border-radius: 16px 16px 4px 16px; background: var(--rose); border-color: var(--rose); color: #fff; }
.support-composer { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.support-composer input { min-width: 0; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); padding: 0 13px; }

.loyalty-hero { padding: 22px; border-radius: 24px; color: #fff; background: linear-gradient(135deg, #24201d, #5c4a3b); overflow: hidden; position: relative; }
.loyalty-hero::after { content: "P"; position: absolute; right: 12px; top: -34px; font: 150px Georgia, serif; color: rgba(255,255,255,.06); }
.balance { font: 38px Georgia, serif; margin: 18px 0 4px; }
.balance small { font: 14px Inter, sans-serif; }
.ledger { margin-top: 22px; }
.ledger-row { padding: 14px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; }
.ledger-row strong.plus { color: var(--success); }
.ledger-row strong.minus { color: var(--rose); }

.wheel-wrap { display: grid; place-items: center; margin: 30px 0; position: relative; }
.wheel {
  width: 272px; height: 272px; border-radius: 50%; border: 10px solid #fff8e8;
  background: conic-gradient(#a55461 0 25%, #d8aa55 0 50%, #49382e 0 75%, #d9b6bb 0);
  box-shadow: 0 16px 38px rgba(61,43,31,.22), inset 0 0 0 2px rgba(50,30,20,.15);
  position: relative;
}
.wheel::before { content: ""; position: absolute; inset: 87px; border-radius: 50%; background: var(--surface); box-shadow: 0 5px 15px rgba(0,0,0,.15); }
.wheel::after { content: "P"; position: absolute; inset: 0; display: grid; place-items: center; font: 32px Georgia, serif; color: var(--rose); }
.wheel-pointer { position: absolute; top: -7px; width: 0; height: 0; border-left: 14px solid transparent; border-right: 14px solid transparent; border-top: 28px solid var(--ink); z-index: 2; }

.avatar { width: 68px; height: 68px; border-radius: 50%; display: grid; place-items: center; background: var(--rose-soft); color: var(--rose); font: 28px Georgia, serif; }
.menu { margin-top: 22px; }
.menu-row { min-height: 54px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); font-size: 14px; }

.state-panel { min-height: 570px; display: grid; place-items: center; text-align: center; padding: 34px; }
.state-icon { width: 72px; height: 72px; border-radius: 50%; background: var(--rose-soft); color: var(--rose); display: grid; place-items: center; margin: 0 auto 18px; font-size: 28px; }
.skeleton { background: linear-gradient(100deg, #eee9e1 20%, #faf7f1 45%, #eee9e1 70%); background-size: 300% 100%; animation: shimmer 1.5s infinite; border-radius: 12px; }
.skeleton.line { height: 14px; margin: 9px 0; }
.skeleton.tile { height: 210px; }
@keyframes shimmer { to { background-position: -150% 0; } }
@keyframes wheel-spin { from { transform: rotate(0deg); } to { transform: rotate(1110deg); } }
.wheel.spinning { animation: wheel-spin 1.25s cubic-bezier(.12,.67,.18,1) forwards; }

.prototype-toast {
  position: absolute; left: 22px; right: 22px; bottom: 92px; z-index: 30;
  padding: 13px 16px; border-radius: 14px; background: #24201d; color: #fff;
  text-align: center; font-size: 13px; box-shadow: 0 12px 30px rgba(0,0,0,.24);
  animation: toast-in .2s ease-out;
}
.offline-banner {
  position: absolute; inset: 34px 0 auto; z-index: 40; padding: 10px 16px;
  background: #3d3833; color: #fff; text-align: center; font-size: 12px; font-weight: 700;
}
@keyframes toast-in { from { opacity: 0; transform: translateY(8px); } }

@media (max-width: 760px) {
  .audit-panel { display: none; }
  .stage { margin: 0; padding: 0; background: var(--paper); }

const renderers = { onboarding, quiz, "quiz-result": quizResult, catalog, product, reviews, cart, favorites, offers, checkout, pickup, "order-success": orderSuccess, orders, order, "order-cancel": orderCancel, support, loyalty, profile, addresses, notifications, referral, subscription, wheel, install, analytics, privacy, offline, "wheel-result": wheelResult, "notifications-empty": notificationsEmpty, "cart-empty": cartEmpty, "favorites-empty": favoritesEmpty, "auth-phone": authPhone, "auth-code": authCode, "profile-edit": profileEdit, "payment-error": paymentError, "order-delivered": orderDelivered, "catalog-loading": catalogLoading, "catalog-empty": () => stateScreen("empty"), "catalog-error": () => stateScreen("error") };

const app = document.querySelector("#app");
const scenarioLabel = document.querySelector("#scenario-label");
const auditNav = document.querySelector("#audit-nav");

function render(next = screen, { remember = true } = {}) {
  if (remember && next !== screen) prototypeState.history.push(screen);
  screen = renderers[next] ? next : "catalog";
  track("screen_view", { screen });
  app.innerHTML = renderers[screen]();
  app.scrollTop = 0;
  scenarioLabel.textContent = `390 × 844 · ${screen} · интерактивный режим`;
  auditNav.innerHTML = scenarios.map(([id, label]) => `<a class="${id === screen ? "active" : ""}" href="?screen=${id}" data-screen="${id}">${label}</a>`).join("");
  if (screen === "catalog") applyCatalogFilters();
  saveState();
}

function goBack() {
  render(prototypeState.history.pop() || "catalog", { remember: false });
}

function toast(message) {
  document.querySelector(".prototype-toast")?.remove();
  const element = document.createElement("div");
  element.className = "prototype-toast";
  element.textContent = message;
  document.querySelector(".phone").append(element);
  setTimeout(() => element.remove(), 1800);
}

function applyCatalogFilters() {
  const query = (document.querySelector("#catalog-search")?.value || "").trim().toLowerCase();
  document.querySelectorAll(".product-card").forEach((card) => {
    const matchesText = !query || card.dataset.productName.includes(query);
    const matchesCategory = prototypeState.catalogFilter === "Все" || card.dataset.productCategory === prototypeState.catalogFilter;
    card.hidden = !(matchesText && matchesCategory);
  });
}

document.addEventListener("click", async (event) => {
  const actionTarget = event.target.closest("[data-action]");
  const action = actionTarget?.dataset.action;

  if (action === "back" || event.target.closest(".back-btn")) {
    event.preventDefault();
    goBack();
    return;
  }
  if (action === "onboarding-next") {
    track("onboarding_step", { step: prototypeState.onboardingStep + 1 });
    if (prototypeState.onboardingStep < onboardingSlides.length - 1) {
      prototypeState.onboardingStep += 1;
      render("onboarding", { remember: false });
    } else {
      prototypeState.onboardingCompleted = true;
      prototypeState.quizStep = 0;
      prototypeState.quizAnswers = {};
      render("quiz");
    }
    return;
  }
  if (action === "onboarding-skip") {
    prototypeState.onboardingCompleted = true;
    track("onboarding_step", { step: "skipped" });
    render("catalog");
    return;
  }
  if (action === "promo-quiz") {
    prototypeState.quizStep = 0;
    prototypeState.quizAnswers = {};
    track("promo_opened", { promo: "fragrance_quiz" });
    render("quiz");
    return;
  }
  if (action === "quiz-back") {
    if (prototypeState.quizStep > 0) {
      prototypeState.quizStep -= 1;
      render("quiz", { remember: false });
    } else goBack();
    return;
  }
  if (action === "quiz-reset") {
    prototypeState.quizStep = 0;
    prototypeState.quizAnswers = {};
    render("quiz", { remember: false });
    toast("Подбор начат заново");
    return;
  }
  if (action === "quiz-answer") {
    prototypeState.quizAnswers = { ...prototypeState.quizAnswers, [actionTarget.dataset.key]: actionTarget.dataset.value };
    track("quiz_answer", { question: actionTarget.dataset.key, answer: actionTarget.dataset.value });
    if (prototypeState.quizStep < quizQuestions.length - 1) {
      prototypeState.quizStep += 1;
      render("quiz", { remember: false });
    } else {
      prototypeState.quizResultIds = quizRecommendations();
      track("quiz_completed", { products: prototypeState.quizResultIds.join(",") });
      render("quiz-result");
    }
    return;
  }
  if (action === "quiz-add-all") {
    prototypeState.quizResultIds.forEach((id) => { prototypeState.cartItems[id] = (Number(prototypeState.cartItems[id]) || 0) + 1; prototypeState.cartVolumes[id] = 15; });
    track("add_to_cart", { product: "quiz_bundle", count: prototypeState.quizResultIds.length });
    render("cart");
    toast("Три аромата добавлены в корзину");
    return;
  }
  if (action === "reorder") {
    prototypeState.cartItems = Object.fromEntries((prototypeState.lastOrder || defaultState.lastOrder).map(({ id, qty }) => [id, qty]));
    prototypeState.cartVolumes = Object.fromEntries((prototypeState.lastOrder || defaultState.lastOrder).map(({ id, volume = 15 }) => [id, volume]));
    prototypeState.promoApplied = false;
    track("reorder_started", { order: "SIM-00001", items: cartItemCount() });
    render("cart");
    toast("Предыдущий заказ добавлен в корзину");
    return;
  }
  if (action === "volume") {
    prototypeState.selectedVolume = Number(actionTarget.dataset.volume) || 15;
    track("variant_selected", { product: prototypeState.selectedProductId, volume: `${prototypeState.selectedVolume} мл` });
    render("product", { remember: false });
    return;
  }
  if (action === "product-increase" || action === "product-decrease") {
    const delta = action === "product-increase" ? 1 : -1;
    prototypeState.productQuantity = Math.max(1, Math.min(9, (Number(prototypeState.productQuantity) || 1) + delta));
    render("product", { remember: false });
    return;
  }
  if (action === "open-reviews") {
    track("reviews_opened", { product: prototypeState.selectedProductId });
    render("reviews");
    return;
  }
  if (action === "review-helpful") {
    actionTarget.textContent = actionTarget.textContent === "Спасибо" ? "Полезно" : "Спасибо";
    toast("Спасибо за обратную связь");
    return;
  }
  if (action === "favorite") {
    event.preventDefault();
    event.stopPropagation();
    const id = actionTarget.dataset.productId || prototypeState.selectedProductId;
    prototypeState.selectedProductId = id;
    const favorite = isFavorite(id);
    prototypeState.favoriteProductIds = favorite ? prototypeState.favoriteProductIds.filter((itemId) => itemId !== id) : [...prototypeState.favoriteProductIds, id];
    track("favorite_toggle", { product: id, value: favorite ? "off" : "on" });
    document.querySelectorAll(`[data-action="favorite"][data-product-id="${id}"]`).forEach((heart) => { heart.textContent = favorite ? "♡" : "♥"; });
    saveState();
    toast(favorite ? "Аромат удалён из избранного" : "Аромат сохранён в избранном");
    return;
  }
  if (action === "add-to-cart") {
    const id = prototypeState.selectedProductId;
    const quantity = Math.max(1, Number(prototypeState.productQuantity) || 1);
    prototypeState.cartItems[id] = (Number(prototypeState.cartItems[id]) || 0) + quantity;
    prototypeState.cartVolumes[id] = Number(prototypeState.selectedVolume) || 15;
    track("add_to_cart", { product: id, volume: `${prototypeState.cartVolumes[id]} мл`, quantity });
    saveState();
    toast(`${quantity} шт. добавлено в корзину`);
    setTimeout(() => render("cart"), 250);
    return;
  }
  if (action === "buy-now") {
    const id = prototypeState.selectedProductId;
    const quantity = Math.max(1, Number(prototypeState.productQuantity) || 1);
    prototypeState.cartItems[id] = (Number(prototypeState.cartItems[id]) || 0) + quantity;
    prototypeState.cartVolumes[id] = Number(prototypeState.selectedVolume) || 15;
    track("buy_now", { product: id, volume: `${prototypeState.cartVolumes[id]} мл`, quantity });
    track("checkout_started", { items: cartItemCount(), source: "buy_now" });
    render("checkout");
    toast("Товар добавлен · осталось подтвердить заказ");
    return;
  }
  if (action === "increase" || action === "decrease") {
    const id = actionTarget.dataset.productId;
    const nextQty = Math.max(0, (Number(prototypeState.cartItems[id]) || 0) + (action === "increase" ? 1 : -1));
    if (nextQty) prototypeState.cartItems[id] = nextQty;
    else { delete prototypeState.cartItems[id]; delete prototypeState.cartVolumes[id]; }
    render("cart", { remember: false });
    return;
  }
  if (action === "filter") {
    prototypeState.catalogFilter = actionTarget.dataset.filter || "Все";
    document.querySelectorAll(".chips .chip").forEach((chip) => chip.classList.toggle("active", chip === actionTarget));
    applyCatalogFilters();
    saveState();
    toast(`Фильтр «${actionTarget.textContent.trim()}» применён`);
    return;
  }
  if (action === "points") {
    prototypeState.usePoints = !prototypeState.usePoints;
    render("cart", { remember: false });
    return;
  }
  if (action === "promo") {
    if (prototypeState.promoApplied) {
      prototypeState.promoApplied = false;
      render("cart", { remember: false });
      toast("Промокод отключён");
      return;
    }
    const code = (document.querySelector("#promo-code")?.value || "").trim().toUpperCase();
    if (!["WELCOME10", "PARIZZ15"].includes(code)) {
      toast("Промокод не найден");
      return;
    }
    prototypeState.promoCode = code;
    prototypeState.promoApplied = true;
    render("cart", { remember: false });
    toast(`Скидка ${Math.round(promoRate() * 100)}% применена`);
    return;
  }
  if (action === "claim-offer") {
    const offerId = actionTarget.dataset.offerId;
    if (!offerId || prototypeState.claimedOfferIds.includes(offerId)) return;
    prototypeState.claimedOfferIds = [...prototypeState.claimedOfferIds, offerId];
    if (offerId === "personal15") { prototypeState.promoCode = "PARIZZ15"; prototypeState.promoApplied = true; }
    track("offer_activated", { offer: offerId });
    render("offers", { remember: false });
    toast(offerId === "personal15" ? "Скидка 15% добавлена в корзину" : offerId === "shipping" ? "Бесплатная доставка активна" : "Двойные баллы активированы");
    return;
  }
  if (action === "delivery") {
    prototypeState.deliveryMethod = actionTarget.dataset.delivery || "courier";
    track("delivery_selected", { method: prototypeState.deliveryMethod });
    if (prototypeState.deliveryMethod === "pickup") render("pickup");
    else render("checkout", { remember: false });
    toast(prototypeState.deliveryMethod === "pickup" ? "Выбран пункт выдачи" : "Выбрана доставка курьером");
    return;
  }
  if (action === "delivery-date") {
    prototypeState.deliveryDate = actionTarget.dataset.date || "tomorrow";
    track("delivery_slot_selected", { date: deliveryDateLabel() });
    render("checkout", { remember: false });
    return;
  }
  if (action === "delivery-slot") {
    prototypeState.deliverySlot = actionTarget.dataset.slot || "10:00–14:00";
    track("delivery_slot_selected", { slot: prototypeState.deliverySlot });
    render("checkout", { remember: false });
    return;
  }
  if (action === "payment") {
    prototypeState.paymentMethod = actionTarget.dataset.payment || "card";
    track("payment_selected", { method: paymentLabels[prototypeState.paymentMethod] });
    render("checkout", { remember: false });
    toast(`Выбрана оплата · ${paymentLabels[prototypeState.paymentMethod]}`);
    return;
  }
  if (action === "select-pickup") {
    prototypeState.selectedPickupPoint = actionTarget.dataset.pickupId || pickupPoints[0].id;
    prototypeState.deliveryMethod = "pickup";
    track("pickup_selected", { point: selectedPickup().name });
    render("checkout", { remember: false });
    toast(`${selectedPickup().name} выбран`);
    return;
  }
  if (action === "save-profile") {
    const name = (document.querySelector("#profile-name")?.value || "").trim();
    const phone = (document.querySelector("#profile-phone")?.value || "").trim();
    const email = (document.querySelector("#profile-email")?.value || "").trim();
    if (!name || !phone) { toast("Заполните имя и телефон"); return; }
    prototypeState.profile = { name, phone, email };
    render("profile");
    toast("Личные данные сохранены");
    return;
  }
  if (action === "push-toggle") {
    const key = actionTarget.dataset.push === "marketing" ? "pushMarketing" : "pushOrders";
    prototypeState[key] = !prototypeState[key];
    track("push_changed", { type: key, value: prototypeState[key] ? "on" : "off" });
    render("profile-edit", { remember: false });
    toast(prototypeState[key] ? "Push-уведомления включены" : "Push-уведомления отключены");
    return;
  }
  if (action === "mark-notifications") {
    prototypeState.notificationFeed = prototypeState.notificationFeed.map((item) => ({ ...item, read: true }));
    track("notifications_read", { count: prototypeState.notificationFeed.length });
    render("notifications", { remember: false });
    toast("Все уведомления прочитаны");
    return;
  }
  if (action === "open-notification") {
    const notification = prototypeState.notificationFeed.find((item) => item.id === actionTarget.dataset.notificationId);
    if (!notification) return;
    notification.read = true;
    track("push_opened", { notification: notification.type, target: notification.screen });
    render(notification.screen || "notifications");
    return;
  }
  if (action === "next-order-status") {
    const nextStage = orderStages[Math.min(orderStatusIndex() + 1, orderStages.length - 1)];
    if (!nextStage || nextStage.id === prototypeState.orderStatus) return;
    prototypeState.orderStatus = nextStage.id;
    let notificationBody = nextStage.body;
    if (nextStage.id === "delivered" && !prototypeState.orderRewarded) {
      const earnedPoints = prototypeState.claimedOfferIds.includes("double-points") || prototypeState.subscription ? 398 : 199;
      prototypeState.points += earnedPoints;
      prototypeState.orderRewarded = true;
      notificationBody = `Заказ получен · начислено ${earnedPoints} баллов`;
    }
    addNotification({ type: nextStage.id === "delivered" ? "points" : "order", title: nextStage.title, body: notificationBody, screen: nextStage.id === "delivered" ? "loyalty" : "order" });
    track("order_status_changed", { order: "SIM-00001", status: nextStage.id });
    render("order", { remember: false });
    toast(prototypeState.pushOrders ? `Push: ${nextStage.title}` : `Статус обновлён: ${nextStage.label}`);
    return;
  }
  if (action === "cancel-reason") {
    prototypeState.selectedCancelReason = actionTarget.dataset.reason || "other";
    render("order-cancel", { remember: false });
    return;
  }
  if (action === "confirm-cancel") {
    if (!canCancelOrder()) { render("order"); toast("Заказ уже нельзя отменить автоматически"); return; }
    prototypeState.orderCancelled = true;
    if (!prototypeState.orderRefunded && prototypeState.lastOrderPointsUsed) {
      prototypeState.points += prototypeState.lastOrderPointsUsed;
      prototypeState.orderRefunded = true;
    }
    addNotification({ title: "Заказ отменён", body: prototypeState.lastOrderPointsUsed ? `${prototypeState.lastOrderPointsUsed} баллов возвращены на баланс` : "Возврат оформлен тем же способом оплаты", screen: "order" });
    track("order_cancelled", { order: "SIM-00001", reason: prototypeState.selectedCancelReason });
    render("order");
    toast("Заказ отменён · возврат оформлен");
    return;
  }
  if (action === "support-topic") {
    const topic = actionTarget.dataset.topic || "Вопрос по заказу";
    prototypeState.supportMessages.push({ id: `support-${Date.now()}`, mine: true, text: topic });
    prototypeState.supportMessages.push({ id: `support-reply-${Date.now()}`, mine: false, text: topic === "Где мой заказ?" ? `Сейчас статус: «${currentOrderStage().label}». Мы пришлём push при следующем изменении.` : "Принято. Специалист подключится к диалогу и увидит данные заказа." });
    track("support_message_sent", { topic });
    render("support", { remember: false });
    return;
  }
  if (action === "send-support") {
    const message = (document.querySelector("#support-message")?.value || "").trim();
    if (!message) { toast("Напишите сообщение"); return; }
    prototypeState.supportMessages.push({ id: `support-${Date.now()}`, mine: true, text: message });
    prototypeState.supportMessages.push({ id: `support-reply-${Date.now()}`, mine: false, text: "Спасибо, сообщение получено. В рабочем приложении здесь ответит оператор PdParizz." });
    track("support_message_sent", { topic: "custom" });
    render("support", { remember: false });
    return;
  }
  if (action === "select-address") {
    prototypeState.selectedAddressId = actionTarget.dataset.addressId;
    render("addresses", { remember: false });
    toast("Адрес выбран");
    return;
  }
  if (action === "add-address") {
    const label = (document.querySelector("#new-address-label")?.value || "").trim();
    const line = (document.querySelector("#new-address-line")?.value || "").trim();
    if (!label || !line) { toast("Заполните название и адрес"); return; }
    const id = `address-${Date.now()}`;
    prototypeState.addresses = [...prototypeState.addresses, { id, label, line, details: "" }];
    prototypeState.selectedAddressId = id;
    render("addresses", { remember: false });
    toast("Новый адрес добавлен");
    return;
  }
  if (action === "pay") {
    const goods = cartGoodsMinor();
    const promo = Math.round(goods * promoRate());
    const usedPointsMinor = prototypeState.usePoints ? Math.min(prototypeState.points * 100, goods - promo) : 0;
    prototypeState.lastOrder = cartEntries().map(({ item, qty, volume }) => ({ id: item.id, qty, volume }));
    prototypeState.lastOrderTotal = orderTotalMinor();
    prototypeState.courierComment = (document.querySelector("#courier-comment")?.value || prototypeState.courierComment || "").trim();
    prototypeState.lastOrderDelivery = prototypeState.deliveryMethod === "pickup" ? `${selectedPickup().name} · ${selectedPickup().address} · ${deliveryDateLabel()}` : `Курьер · ${deliveryDateLabel()}, ${prototypeState.deliverySlot}`;
    prototypeState.lastOrderPayment = paymentLabels[prototypeState.paymentMethod] || paymentLabels.card;
    prototypeState.orderStatus = "confirmed";
    prototypeState.orderRewarded = false;
    prototypeState.orderCancelled = false;
    prototypeState.orderRefunded = false;
    prototypeState.lastOrderPointsUsed = Math.round(usedPointsMinor / 100);
    addNotification({ title: "Заказ подтверждён", body: "Оплата получена · начинаем собирать заказ", screen: "order" });
    track("order_completed", { order: "SIM-00001", total: rub(prototypeState.lastOrderTotal), delivery: prototypeState.lastOrderDelivery, payment: prototypeState.lastOrderPayment });
    prototypeState.points = Math.max(0, prototypeState.points - Math.round(usedPointsMinor / 100));
    prototypeState.cartItems = {};
    prototypeState.cartVolumes = {};
    render("order-success");
    toast("Заказ SIM-00001 успешно оформлен");
    return;
  }
  if (action === "send-code") {
    const phone = (document.querySelector("#auth-phone-input")?.value || "").trim();
    if (phone.replace(/\D/g, "").length < 10) { toast("Введите корректный номер"); return; }
    prototypeState.loginPhone = phone;
    render("auth-code");
    document.querySelector(".otp-input")?.focus();
    toast("Код отправлен · в демо используйте 0000");
    return;
  }
  if (action === "login") {
    const code = [...document.querySelectorAll(".otp-input")].map((input) => input.value).join("");
    if (code !== "0000") { toast("Неверный код · введите 0000"); return; }
    prototypeState.isAuthenticated = true;
    track("login", { method: "phone" });
    prototypeState.profile = { ...prototypeState.profile, phone: prototypeState.loginPhone };
    let referralMessage = "";
    if (prototypeState.referralRewardPending && !prototypeState.referralRewardClaimed) {
      prototypeState.points += 300;
      prototypeState.referralRewardPending = false;
      prototypeState.referralRewardClaimed = true;
      track("referral_reward", { code: prototypeState.referralCode, points: 300 });
      referralMessage = " · +300 баллов по приглашению";
    }
    render("catalog");
    toast(`Вы вошли в профиль${referralMessage}`);
    return;
  }
  if (action === "logout") {
    prototypeState.isAuthenticated = false;
    render("auth-phone");
    toast("Локальная сессия завершена");
    return;
  }
  if (action === "share") {
    try { await navigator.clipboard.writeText("https://achukhliebov.github.io/pdparizz-mobile-demo/?ref=ARTUR7X&screen=auth-phone"); } catch {}
    toast("Реферальная ссылка скопирована");
    return;
  }
  if (action === "tariff") {
    prototypeState.subscriptionPlan = actionTarget.dataset.plan === "monthly" ? "monthly" : "annual";
    render("subscription", { remember: false });
    toast(prototypeState.subscriptionPlan === "monthly" ? "Выбран тариф «Месяц»" : "Выбран тариф «Год»");
    return;
  }
  if (action === "subscribe") {
    if (prototypeState.subscription) {
      prototypeState.subscription = false;
      prototypeState.subscriptionStartedAt = null;
      track("subscription_changed", { value: "cancelled", plan: prototypeState.subscriptionPlan });
      render("subscription", { remember: false });
      toast("Подписка отменена · доступ сохранён до конца периода");
    } else {
      prototypeState.subscription = true;
      prototypeState.subscriptionStartedAt = new Date().toISOString();
      track("subscription_changed", { value: "active", plan: prototypeState.subscriptionPlan });
      render("profile");
      toast("Подписка PdParizz активирована");
    }
    return;
  }
  if (action === "spin") {
    if (!canSpinToday()) { toast("Следующая попытка будет доступна завтра"); return; }
    actionTarget.disabled = true;
    actionTarget.textContent = "Определяем подарок…";
    document.querySelector(".wheel")?.classList.add("spinning");
    setTimeout(() => {
      prototypeState.lastWheelSpinDate = todayKey();
      prototypeState.points += 100;
      track("wheel_reward", { points: 100 });
      render("wheel-result");
    }, 1300);
    return;
  }
  if (action === "install-app") {
    track("install_requested", { platform: isIOS() ? "ios" : "other" });
    saveState();
    if (isStandalone()) { toast("PdParizz уже установлен"); return; }
    if (deferredInstallPrompt) {
      deferredInstallPrompt.prompt();
      const choice = await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
      toast(choice.outcome === "accepted" ? "Установка началась" : "Установку можно выполнить позже");
    } else {
      toast(isIOS() ? "Safari → Поделиться → На экран Домой" : "Откройте меню браузера → Установить приложение");
    }
    return;
  }
  if (action === "clear-analytics") {
    prototypeState.analyticsEvents = [];
    render("analytics", { remember: false });
    toast("Локальные события очищены");
    return;
  }

  const screenTarget = event.target.closest("[data-screen]");
  if (screenTarget?.dataset.screen) {
    event.preventDefault();
    if (screenTarget.dataset.productId) {
      prototypeState.selectedProductId = screenTarget.dataset.productId;
      prototypeState.selectedVolume = Number(prototypeState.cartVolumes[screenTarget.dataset.productId]) || 15;
      prototypeState.productQuantity = 1;
      track("product_view", { product: screenTarget.dataset.productId });
    }
    if (screenTarget.dataset.screen === "checkout") track("checkout_started", { items: cartItemCount() });
    render(screenTarget.dataset.screen);
    return;
  }

  const button = event.target.closest("button");
  const label = button?.textContent.trim() || "";
  if (label === "Перейти в каталог" || label === "Найти аромат" || label === "Выбрать аромат" || label === "Сбросить фильтры" || label === "Повторить") render("catalog");
  else if (label === "Попробовать ещё раз" || label === "Выбрать другой способ") render("checkout");
  else if (label === "Повторить заказ") { prototypeState.cartItems = Object.fromEntries((prototypeState.lastOrder || defaultState.lastOrder).map(({ id, qty }) => [id, qty])); render("cart"); }
  else if (button?.closest(".switch") || button?.classList.contains("switch")) button.classList.toggle("off");

});

document.addEventListener("input", (event) => {
  if (event.target.id === "catalog-search") { applyCatalogFilters(); return; }
  if (event.target.id === "courier-comment") { prototypeState.courierComment = event.target.value; saveState(); return; }
  if (event.target.classList.contains("otp-input")) {
    event.target.value = event.target.value.replace(/\D/g, "").slice(-1);
    if (event.target.value) event.target.nextElementSibling?.focus();
  }
});

window.addEventListener("beforeinstallprompt", (event) => {
  event.preventDefault();
  deferredInstallPrompt = event;
});
window.addEventListener("appinstalled", () => {
  deferredInstallPrompt = null;
  toast("PdParizz добавлен на устройство");
});
window.addEventListener("offline", () => toast("Нет сети · включён офлайн-режим"));
window.addEventListener("online", () => toast("Соединение восстановлено"));
if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(() => {});
if (deepLinkProduct) track("product_view", { product: deepLinkProduct, source: "deep_link" });
if (params.get("source") === "installed") track("screen_view", { screen: "installed_launch" });
render(screen, { remember: false });
if (incomingReferral && prototypeState.referralRewardPending) setTimeout(() => toast("Реферальный подарок готов · войдите, чтобы получить 300 баллов"), 250);

</script>
  </body>
</html>
